name: Build & Release

on:
  # 正式发布：推送 v* tag，或合并 release/* PR。
  push:
    tags:
      - 'v*'
  # branches 只能过滤目标分支；版本文件过滤减少无关 PR 产生的空 workflow run，
  # prepare job 再校验源分支、仓库与 merged 状态。
  pull_request:
    types: [closed]
    paths:
      - package.json
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - src-tauri/tauri.conf.json
  # 手动触发：创建预发布测试构建。
  workflow_dispatch:
    inputs:
      platform_filter:
        description: 选择需要打包的平台
        required: true
        default: all
        type: choice
        options:
          - all
          - macos-aarch64
          - macos-x86_64
          - windows
          - linux

permissions: {}

# 同一 tag/PR 的重复运行整体排队，平台内部再通过 needs 链串行写 Release。
concurrency:
  group: release-workflow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release
    permissions:
      contents: write
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      should_release: ${{ steps.meta.outputs.should_release }}
      source_ref: ${{ steps.meta.outputs.source_ref }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Read release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
        run: node scripts/release-identity.mjs

      - name: Create release tag
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_SHA: ${{ steps.meta.outputs.source_ref }}
        with:
          script: |
            const ref = `tags/${process.env.RELEASE_TAG}`;
            const sha = process.env.RELEASE_SHA;
            try {
              await github.rest.git.getRef({ ...context.repo, ref });
              await github.rest.git.updateRef({ ...context.repo, ref, sha, force: true });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ ...context.repo, ref: `refs/${ref}`, sha });
            }

      - name: Create release and generate release notes
        if: steps.meta.outputs.should_release == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_NAME: DeepSeek Harness Desktop ${{ steps.meta.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const name = process.env.RELEASE_NAME;
            const prerelease = process.env.RELEASE_PRERELEASE === 'true';
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: tag,
                name,
                draft: true,
                generate_release_notes: true,
                prerelease,
              });
            }

      - name: Append Artifacts section to release
        if: steps.meta.outputs.should_release == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const { data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
            const marker = '### 📦 Artifacts';
            if ((release.body || '').includes(marker)) return;
            const section = [
              marker,
              '- **macOS (Apple Silicon)**: 下载 `aarch64.dmg`',
              '- **macOS (Intel)**: 下载 `x64.dmg`',
              '- **Windows**: 下载 `.exe`',
              '- **Linux (x64)**: 下载 `.AppImage` 或 `.deb`（基于 Ubuntu 22.04 构建）',
            ].join('\n');
            const body = release.body ? `${release.body.trimEnd()}\n\n${section}` : section;
            await github.rest.repos.updateRelease({ ...context.repo, release_id: release.id, body });

  # 三个平台只构建 Actions artifacts，互不写 GitHub Release，因此可以完全并行。
  build-macos:
    name: Build macOS Artifacts
    needs: prepare
    if: >-
      needs.prepare.result == 'success' &&
      (github.event_name != 'workflow_dispatch' ||
       inputs.platform_filter == 'all' ||
       startsWith(inputs.platform_filter, 'macos-'))
    permissions:
      contents: read
    uses: ./.github/workflows/build-macos.yml
    with:
      platform_filter: ${{ github.event_name == 'workflow_dispatch' && inputs.platform_filter || 'all' }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  build-windows:
    name: Build Windows Artifacts
    needs: prepare
    if: >-
      needs.prepare.result == 'success' &&
      (github.event_name != 'workflow_dispatch' ||
       inputs.platform_filter == 'all' ||
       inputs.platform_filter == 'windows')
    permissions:
      contents: read
    uses: ./.github/workflows/build-windows.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_ref }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  build-linux:
    name: Build Linux Artifacts
    needs: prepare
    if: >-
      needs.prepare.result == 'success' &&
      (github.event_name != 'workflow_dispatch' ||
       inputs.platform_filter == 'all' ||
       inputs.platform_filter == 'linux')
    permissions:
      contents: read
    uses: ./.github/workflows/build-linux.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_ref }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  # 单一 writer 下载全部成功构建的产物，一次性上传并发布 Release。
  finalize:
    name: Publish GitHub Release
    needs: [prepare, build-macos, build-windows, build-linux]
    if: >-
      always() && needs.prepare.result == 'success' &&
      ((github.event_name != 'workflow_dispatch' &&
        needs.build-macos.result == 'success' &&
        needs.build-windows.result == 'success' &&
        needs.build-linux.result == 'success') ||
       (github.event_name == 'workflow_dispatch' &&
        (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') &&
        (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
        (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped')))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download build outputs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify downloaded assets
        run: |
          find release-assets -type f -print
          [ -n "$(find release-assets -type f -print -quit)" ] || {
            echo '::error::No release assets were downloaded'
            exit 1
          }

      - name: Upload assets and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # finalize 未 checkout，gh 无法从 .git 推断仓库，需显式指定。
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('test-{0}-{1}', github.ref_name, github.run_number) || needs.prepare.outputs.tag }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' || needs.prepare.outputs.prerelease == 'true' }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --title "DeepSeek Harness Desktop $RELEASE_TAG"
          fi
          mapfile -d '' assets < <(find release-assets -type f -print0)
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
