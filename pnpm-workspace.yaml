shellEmulator: true

trustPolicy: no-downgrade
# Ignore the trust-level check for packages published more than 1 year ago.
# Older transitive versions (e.g. semver@6.3.1, undici-types@6.21.0) predate the
# package's adoption of trusted publishing and falsely read as a "trust downgrade".
trustPolicyIgnoreAfter: 525600

patchedDependencies:
  bumpp: patches/bumpp.patch

catalogMode: prefer

# 让 pnpm deploy（无 --legacy）产出「注入式」的紧凑生产闭包：把 workspace 包作为依赖
# 注入到产物 node_modules，而不是链接到共享存储，从而只捆绑插件及其真实生产依赖。
inject-workspace-packages: true

packages:
  - 'packages/*'

catalogs:
  cli:
    tsdown: ^0.17.3
    typescript: ~5.8.3
    publint: ^0.3.16
  dsh:
    '@deepseek-ai/cordis': 4.0.1
    '@deepseek-ai/dsh-skill-filesystem': ^0.1.1-rc.1
  testing:
    yaml: ^2.9.0
  ui:
    css-render: ^0.15.14
    dompurify: ^3.4.13
    marked: ^18.0.10
  utils:
    smol-toml: ^1.3.1

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
