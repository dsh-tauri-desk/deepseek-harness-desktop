catalogMode: prefer

shellEmulator: true

trustPolicy: no-downgrade
# Ignore the trust-level check for packages published more than 1 year ago.
# Older transitive versions (e.g. semver@6.3.1, undici-types@6.21.0) predate the
# package's adoption of trusted publishing and falsely read as a "trust downgrade".
trustPolicyIgnoreAfter: 525600

# 让 pnpm deploy（无 --legacy）产出「注入式」的紧凑生产闭包：把 workspace 包作为依赖
# 注入到产物 node_modules，而不是链接到共享存储，从而只捆绑插件及其真实生产依赖。
inject-workspace-packages: true

packages:
  - 'packages/*'

patchedDependencies:
  bumpp: patches/bumpp.patch

# 命名 catalog 分组：按用途归类依赖，包内通过 `catalog:<分组>` 引用。
catalogs:
  # 构建工具链（Vite + Tailwind + TS 编译 + React 编译器）
  build:
    '@tailwindcss/postcss': 4.1.11
    '@tailwindcss/vite': 4.1.11
    '@vitejs/plugin-react': ^4.6.0
    babel-plugin-react-compiler: ^1.0.0
    tailwindcss: 4.1.11
    tsx: ^4.23.12
    vite: ^7.0.4
  # CLI 构建工具（插件全部依赖 tsdown / typescript）
  cli:
    publint: ^0.3.16
    tsdown: ^0.17.3
    typescript: ~5.8.3
  # dsh 生态（核心 + 客户端 UI/运行时 + 技能；alpha.3 线，dsh-client-runtime 已拆分移除）
  dsh:
    '@deepseek-ai/cordis': ^4.0.2
    '@deepseek-ai/dsh-api-session-controller': 0.1.2-alpha.3
    '@deepseek-ai/dsh-api-workspace-controller': 0.1.2-alpha.3
    '@deepseek-ai/dsh-client-store': 0.1.2-alpha.3
    '@deepseek-ai/dsh-client-ui-layout': 0.1.2-alpha.3
    '@deepseek-ai/dsh-client-ui-primitives': 0.1.2-alpha.3
    '@deepseek-ai/dsh-client-ui-renderer': 0.1.2-alpha.3
    '@deepseek-ai/dsh-client-ui-slots': 0.1.2-alpha.3
    '@deepseek-ai/dsh-skill-filesystem': ^0.1.2-alpha.3
  # 代码质量 / lint（eslint stack + knip 死代码检测）
  lint:
    '@antfu/eslint-config': ^9.3.0
    '@eslint-react/eslint-plugin': ^5.18.6
    eslint: ^10.8.1
    eslint-plugin-react-refresh: ^0.5.4
    knip: ^6.32.2
  # 发布流程
  release:
    bumpp: 12.2.1
    changelogithub: 15.0.5
  # 桌面端运行时与 UI 依赖（React 生态、状态、i18n、UI 组件库）
  runtime:
    '@gravity-ui/icons': ^2.21.0
    '@hairy/react-lib': ^1.52.0
    '@heroui/react': ^3.2.4
    '@heroui/styles': ^3.2.4
    '@overlastic/react': ^0.9.0
    '@tanstack/react-query': ^5.101.4
    i18next: ^26.3.6
    react: ^19.2.8
    react-dom: ^19.2.8
    react-i18next: ^17.0.11
    react-if-lite: ^0.1.0
    react-use: ^17.6.1
    tailwind-variants: ^3.3.1
    valtio-define: ^1.4.1
  # Tauri 相关
  tauri:
    '@tauri-apps/api': ^2.11.1
    '@tauri-apps/cli': ^2.11.4
    '@tauri-apps/plugin-clipboard-manager': ^2.3.2
  # 测试
  testing:
    vitest: ^4.1.11
    yaml: ^2.9.0
  # TypeScript 类型定义
  types:
    '@types/node': ^22.10.0
    '@types/react': ^19.2.18
    '@types/react-dom': ^19.2.4
  # UI 呈现（插件渲染富文本/样式）
  ui:
    css-render: ^0.15.14
    dompurify: ^3.4.13
    marked: ^18.0.10

  # 工具库（根项目与插件共用）
  utils:
    '@hairy/utils': ^1.52.0
    citty: ^0.2.2
    consola: ^3.4.2
    cron-schedule: ^6.0.0
    date-fns: ^4.4.0
    dotenv: ^17.4.2
    hookable: ^6.1.1
    ofetch: ^1.5.1
    pathe: ^2.0.3
    smol-toml: ^1.3.1
    tinyexec: ^1.3.0
    unstorage: ^1.17.5

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
